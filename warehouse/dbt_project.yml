name: games_kpi
version: "0.1.0"
config-version: 2
profile: games_kpi

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

models:
  games_kpi:
    +materialized: table
    clean:
      +schema: null
    marts:
      +schema: null

vars:
  # How many days back each incremental run reprocesses. Firebase keeps updating a
  # day's export for up to 72 hours, so keep this at 3 or more.
  lookback_days: 3
  # Earliest date read on a full refresh (YYYYMMDD).
  start_date: "20240101"

  # One entry per game. This is the only place a new game has to be added.
  #   game_id            short stable id used everywhere (letters, digits, _)
  #   name               display name in the dashboard
  #   engine             unity | flutter
  #   firebase_project   Google Cloud project that holds the game's Firebase export
  #   analytics_dataset  the export dataset, e.g. analytics_123456789 (leave out until it exists:
  #                      the game then shows store revenue only)
  #   timezone           IANA timezone that defines the game's "day"
  #   package_name       store package id (com.studio.game); needed for play_reports and admob_api
  #   iap_source         wrapper (our iap_purchase event) | firebase_auto (Firebase in_app_purchase)
  #                      | play_reports (Google Play sales reports: real orders only, no per-player split)
  #   ad_revenue_source  wrapper (our ad_impression) | firebase_auto (AdMob auto-logged ad_impression)
  #                      | admob_api (AdMob mediation report, every ad source, no per-player split)
  #   store_fee          share the store keeps, used for net IAP revenue (0.15 or 0.30)
  #   d1_target, d7_target  retention targets shown on the dashboard
  #   level_number_param    optional: the param that holds the level number, if not level_number
  #   tutorial_step_events  optional: for games with their own tutorial events, which events count as
  #                         steps ({prefix: ftue_, extra: [...]}); the step number is read from `step`
  #                         or, without one, from step_order (step_name param) or step_events (event names)
  #   level_event_pattern   optional: regex for games that put the level in the event name
  #                         (level_(\d+)_reached); matching events count as level_up
  #   extra_package_names   optional: more AdMob / Play app ids for the same game, e.g. its iOS App Store id
  games:
    # Pilot (launched 2026-11-06). Unity, Android, AdMob without mediation, Unity IAP, Meta SDK.
    # Revenue comes from Google Play's sales reports and the AdMob API (Firebase has no revenue events for it).
    - game_id: gem_mine
      name: Flintbeard's Gem Mine
      engine: unity
      firebase_project: gem-mine-a1d9d
      analytics_dataset: analytics_562289841
      timezone: UTC
      package_name: com.tycoonstylegames.gemmine
      iap_source: play_reports
      ad_revenue_source: admob_api
      store_fee: 0.15
      d1_target: 0.40
      d7_target: 0.15
      # Until the wrapper build ships, the game's own events: level = mine, tutorial = ftue_* with `step`.
      level_number_param: mine
      tutorial_step_events: {prefix: ftue_, extra: [mine1_complete]}

    # Trade Empire: Cargo Tycoon. Flutter, Android, AdMob mediation (Unity, Meta), Google Play IAP, Tenjin.
    # Revenue comes from Google Play's sales reports and the AdMob API.
    - game_id: trade_empire
      name: "Trade Empire: Cargo Tycoon"
      engine: flutter
      firebase_project: trade-empire-cargo-tycoon
      analytics_dataset: analytics_556106117
      timezone: UTC
      package_name: com.michaelgames.trade_empire
      iap_source: play_reports
      ad_revenue_source: admob_api
      store_fee: 0.15
      d1_target: 0.40
      d7_target: 0.15
      level_number_param: level
      # tutorial_step_completed carries step_name only; the numbers follow the game's TutorialStep order
      # (lib/models/tutorial.dart, analyticsName).
      tutorial_step_events:
        begin: tutorial_started
        events: [tutorial_step_completed]
        step_order: [intro, map_introduced, tapLondon, tapTrade, chooseParis, chooseCargo, chooseVehicle,
          first_trade_started, watchDelivery, openDeliveries, waitDelivery, first_delivery_collected,
          level2_introduced, tapNetherlands, unlockCountry, tapAmsterdam, hub_purchased, tapNewHub,
          tapTradeNewHub, chooseLondon, chooseBetterTrade, openContracts, contracts_introduced,
          fleet_introduced, openMarket, second_vehicle_purchased, compareVehicles, vehicle_upgraded,
          idle_vehicle_sent, empireGrowing, hub_upgrade_started, speedUp, tutorial_completed]

    # Business Empire: World Tycoon. Flutter, Android + iOS (same Firebase project), AdMob, Google Play /
    # App Store IAP, Tenjin + Meta. On the App Store and in AdMob the iOS app is "Global Property Tycoon".
    # Revenue comes from Google Play's sales reports and the AdMob API (Firebase has no revenue events for it).
    - game_id: business_empire
      name: "Business Empire: World Tycoon"
      engine: flutter
      firebase_project: global-properties-tycoon
      analytics_dataset: analytics_539653015
      timezone: UTC
      package_name: com.michaelgames.global_assets_tycoon
      extra_package_names: ["6804374009"]   # iOS App Store id (AdMob app ~6621130077)
      iap_source: play_reports
      ad_revenue_source: admob_api
      store_fee: 0.15
      d1_target: 0.40
      d7_target: 0.15
      # The game logs level_<n>_reached (lib/services/analytics_service.dart) and onboarding_* events.
      level_event_pattern: '^level_(\d+)_reached$'
      tutorial_step_events:
        begin: onboarding_started
        step_events: [onboarding_country_chosen, onboarding_first_property_purchased,
          onboarding_first_rent_collected, onboarding_completed]
