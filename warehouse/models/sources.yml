version: 2

sources:
  # Written by scripts/load_revenue.py before each build, in the build's own dataset.
  - name: store
    schema: "{{ target.schema }}"
    tables:
      - name: src_play_sales
        description: Google Play estimated sales report rows (one per order or refund), USD-converted.
      - name: src_admob_daily
        description: AdMob mediation report per day, app, country, format, platform and ad source (USD).
      # Written by scripts/load_history.py: daily totals from before a game's BigQuery export.
      - name: src_ga4_daily
        description: GA4 Data API daily active/new users, sessions and engagement per property, platform and country.
      - name: src_play_installs
        description: Google Play install statistics per day, package and country (stats/installs/*_country.csv).

  # Written by scripts/load_ua_costs.py: UA spend from ad networks, in the build's own dataset.
  - name: ua
    schema: "{{ target.schema }}"
    tables:
      - name: src_meta_ads_daily
        description: Meta Ads insights per day, ad account, ad and country, with the promoted app, spend in USD and Meta-reported installs and purchases.
      - name: src_meta_ads
        description: Every Meta ad with its ad set, campaign and creative (name, thumbnail, title, body).
      # Written by scripts/load_meta_referrers.py: Meta's encrypted Play install referrers, decrypted.
      - name: src_meta_install_referrers
        description: One row per meta_install_referrer event, with the Meta campaign, ad set and ad it names.
