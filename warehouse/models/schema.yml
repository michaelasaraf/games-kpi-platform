version: 2

models:
  - name: clean_events
    description: Every event of every game, deduplicated, with the params we use as columns.
    columns:
      - name: game_id
        data_tests: [not_null]
      - name: event_date
        data_tests: [not_null]
      - name: player_id
        data_tests: [not_null]
      - name: event_key
        data_tests: [not_null]

  - name: player_day
    description: One row per game, player and game-local day.
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_id, event_date, player_id]
    columns:
      - name: install_date
        data_tests: [not_null]
      - name: days_since_install
        data_tests:
          - not_negative

  - name: player_attribution
    description: One row per game and player with the UA source (attribution SDK, then Play referrer, then Firebase).
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_id, player_id]
    columns:
      - name: ua_source
        data_tests: [not_null]

  - name: player_country
    description: One row per game and player with the country of the first day they were seen.
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_id, player_id]

  - name: dim_games
    description: Games registry from dbt_project.yml.
    columns:
      - name: game_id
        data_tests: [unique, not_null]

  - name: kpi_daily
    description: Additive daily totals per game, date, platform, country, UA source.
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_id, event_date, platform, country, ua_source]

  - name: kpi_ua_spend
    description: UA spend (Meta Ads) per game, date, platform, country, channel and campaign.
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_id, spend_date, platform, country, channel, campaign_id]

  - name: kpi_active_users
    description: DAU, WAU and MAU per game, date, platform, country, UA source.
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_id, event_date, platform, country, ua_source]

  - name: kpi_cohort
    description: Install cohorts by day since install (retention and LTV).
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_id, install_date, platform, country, ua_source, day_n]

  - name: kpi_levels
    description: Level funnel and difficulty per game, date, platform, country, UA source, level.
  - name: kpi_tutorial
    description: Tutorial funnel by install cohort.
  - name: kpi_churn_levels
    description: Last level reached by players inactive for 3+ days.
  - name: kpi_economy
    description: Currency sources and sinks.
  - name: kpi_data_health
    description: Events seen per game in the last 7 days, for the integration checklist.
